name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests from branches of this repository: the macOS leg runs on
        # the Mac through scripts/ci-mac-gate.sh, which posts a commit status
        # named "Test (macos-latest)", like the hosted job (#55). Fork PRs and
        # manual runs keep the hosted macOS job: the gate does not run untrusted
        # code on the Mac. Keep the job name in step with the gate's context.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        # Pinned from refs/tags/v7.0.0 on 2026-09-26.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        # Pinned from refs/heads/stable on 2026-09-26.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Checks
        run: sh scripts/ci-local.sh
