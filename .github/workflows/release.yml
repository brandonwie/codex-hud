name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # Pinned from refs/tags/v7.0.0 on 2026-09-26.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        id: rust
        # Pinned from refs/heads/stable on 2026-09-26.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Same cache and clean-up as ci.yml; keep these two steps equal in both
      # files. A run on main saves the cache that pull requests read.
      - name: Cache Rust build
        # Pinned from refs/tags/v6.1.0 on 2026-11-23.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: rust-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      # See ci.yml: a restored crate build could be newer than this checkout.
      - name: Remove cached codex-hud artifacts
        run: |
          cargo clean --manifest-path rust/Cargo.toml -p codex-hud
          cargo clean --manifest-path rust/Cargo.toml -p codex-hud --release

      # The same four checks as ci.yml, from the one list in ci-local.sh.
      - name: Checks
        run: sh scripts/ci-local.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    if: github.repository == 'brandonwie/codex-hud'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # Pinned from refs/tags/v7.0.0 on 2026-09-26.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
