name: Claude Code Review

# "@claude review" on a pull request runs the shared review workflow in
# brandonwie/claude-review, which owns the action pin, model, trigger gate,
# token routing, prompt and tool allowlist. What to review lives in REVIEW.md
# at the repository root, read from the default branch.

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Pinned from refs/heads/main on 2026-11-22 (both jobs ubuntu-latest), so
    # a change upstream cannot bring a new runner here unreviewed (#55). To
    # update: check the new revision's runs-on values, then bump the SHA.
    uses: brandonwie/claude-review/.github/workflows/claude-review.yml@e3250d2a49a0fec82edc76d74418a0f02001d85e
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
