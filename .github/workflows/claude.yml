name: Claude Code Review

# "@claude review" on a pull request runs the shared review workflow in
# brandonwie/claude-review, which owns the action pin, model, trigger gate,
# token routing, prompt and tool allowlist. What to review lives in REVIEW.md
# at the repository root, read from the default branch.

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    uses: brandonwie/claude-review/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
