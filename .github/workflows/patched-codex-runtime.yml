name: Patched Codex Runtime

# Publishes checksummed patched-Codex runtimes so codex-hud installs and syncs
# never compile Codex. Every hour the plan job picks the latest stable upstream
# Codex release and builds only the macOS targets whose archive for the current
# patch set (scripts/codex-patch-set.js) is not yet published. GitHub disables
# scheduled workflows after 60 days without repository activity; re-enable this
# workflow in the Actions tab if that happens.

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs most.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: OpenAI Codex version to patch (without rust-v prefix). Empty means the latest stable release.
        required: false
        type: string
        default: ""
      target:
        description: Rust target triple to build and publish when its archive is missing
        required: true
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin

permissions:
  contents: write

# One run at a time: a queued scheduled run re-plans after the running one
# publishes, so it never rebuilds an archive that just landed.
concurrency:
  group: patched-codex-runtime
  cancel-in-progress: false

jobs:
  plan:
    name: Plan missing runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      codex_version: ${{ steps.plan.outputs.codex_version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Checkout
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Pinned from refs/tags/v7.0.0 on 2026-09-26.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Resolve version and missing targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.codex_version }}
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: node scripts/plan-runtime-publish.js >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS runtime (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The plan job maps each target to its native runner: macos-15 is Apple
    # Silicon, macos-15-intel is x86_64.
    runs-on: ${{ matrix.runner }}
    # Hard cap. Cold-cache builds of the 126-crate Codex workspace have been
    # observed past 64 minutes on the Intel runner; actions/cache only saves on
    # success, so a cap below the cold-build time can never bootstrap the cache.
    timeout-minutes: 90
    env:
      CODEX_VERSION: ${{ needs.plan.outputs.codex_version }}
      CODEX_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "none"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - name: Checkout
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Pinned from refs/tags/v7.0.0 on 2026-09-26.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        # Pinned from refs/heads/stable on 2026-09-26.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Restore Cargo cache
        # Pinned from refs/tags/v6.1.0 on 2026-09-26.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/cargo-target
          key: patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/codex-patch-set.js') }}-${{ needs.plan.outputs.codex_version }}
          restore-keys: |
            patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/codex-patch-set.js') }}-
            patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Validate input
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.env.CODEX_VERSION)) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:rust

      - name: Build patched Codex
        # CARGO_TARGET_DIR is step-scoped on purpose: the runner context is
        # invalid in job-level env (workflow is rejected at dispatch), and a
        # job-wide target dir would also redirect the renderer build away from
        # rust/target/release/, which the installer resolves by fixed path.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          (
            while sleep 60; do
              echo "Cargo build heartbeat: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
              pgrep -fl 'cargo|rustc' | tail -20 || true
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          node scripts/install-patched-codex.js \
            --mode patched \
            --source-build \
            --version "$CODEX_VERSION" \
            --prefix "$RUNNER_TEMP/prefix" \
            --cache-dir "$RUNNER_TEMP/cache"

      - name: Upload Cargo timings
        if: always()
        # Pinned from refs/tags/v7.0.1 on 2026-09-26.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-${{ needs.plan.outputs.codex_version }}-${{ matrix.target }}-cargo-timings
          path: ${{ runner.temp }}/cargo-target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package runtime and licenses
        # Shared packager: bundles codex + LICENSE + NOTICE +
        # codex-hud-runtime.json, ad-hoc codesigns, health-checks --version, then
        # writes the patch-set-named archive and its .sha256.
        run: |
          node scripts/package-patched-runtime.js \
            --payload "$RUNNER_TEMP/prefix/codex-hud-codex.d/$CODEX_VERSION/codex" \
            --version "$CODEX_VERSION" \
            --target "$CODEX_TARGET" \
            --source "$RUNNER_TEMP/cache/openai-codex-rust-v${CODEX_VERSION}" \
            --work "$RUNNER_TEMP" \
            --dist dist

      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="codex-runtime-v${CODEX_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if ! gh release create "$tag" \
              --title "Patched Codex runtime ${CODEX_VERSION}" \
              --notes "Checksummed codex-hud patched runtimes for OpenAI Codex ${CODEX_VERSION}. Archive names carry the codex-hud patch-set id; each archive includes patch provenance plus the upstream Apache-2.0 LICENSE and NOTICE files."; then
              # Another target lane may have created the shared release after
              # our initial lookup. Continue only when that release now exists.
              gh release view "$tag" >/dev/null 2>&1
            fi
          fi
          # Archive names carry the patch-set id, so --clobber only replaces an
          # identical-identity archive from a re-run, never another patch set's.
          gh release upload "$tag" dist/* --clobber
