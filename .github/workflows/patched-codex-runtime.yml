name: Patched Codex Runtime

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: OpenAI Codex version to patch (without rust-v prefix)
        required: true
        type: string
      target:
        description: Rust target triple to build and publish
        required: true
        type: choice
        default: aarch64-apple-darwin
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      local_build_ok:
        description: >-
          Confirm a successful local source build of this exact version
          preceded this dispatch. Runner-minute guard for the Intel target,
          whose cold builds exceed an hour: that job refuses to build without
          it. The arm64 target ignores it.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: patched-codex-runtime-${{ inputs.codex_version }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS runtime (${{ inputs.target }})
    # macos-15 is Apple Silicon (arm64); the Intel target needs the
    # macos-15-intel label. Both build natively, so no cross-compilation.
    runs-on: ${{ inputs.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'macos-15' }}
    # Hard cap. Cold-cache builds of the 126-crate Codex workspace have been
    # observed past 64 minutes; actions/cache only saves on success, so a cap
    # below the cold-build time can never bootstrap the cache. Tighten after
    # reading the cargo --timings artifact from a successful cached run.
    timeout-minutes: 90
    env:
      CODEX_VERSION: ${{ inputs.codex_version }}
      CODEX_TARGET: ${{ inputs.target }}
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "none"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - name: Assert local build gate
        # Intel-only runner-minute guard; arm64 builds finish in minutes.
        if: ${{ inputs.target == 'x86_64-apple-darwin' && !inputs.local_build_ok }}
        run: |
          echo "::error::Refusing to build: local_build_ok is false. Run the local source build for this version first, then re-dispatch with local_build_ok=true."
          exit 1

      - name: Checkout
        # Pinned from refs/tags/v6 on 2026-06-11.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Pinned from refs/tags/v4 on 2026-06-11.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        # Pinned from refs/heads/stable on 2026-06-10.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Restore Cargo cache
        # Pinned from refs/tags/v5.0.4 on 2026-08-06.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/cargo-target
          key: patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('scripts/install-patched-codex.js') }}-${{ inputs.codex_version }}
          restore-keys: |
            patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('scripts/install-patched-codex.js') }}-
            patched-codex-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-

      - name: Validate input
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.env.CODEX_VERSION)) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:rust

      - name: Build patched Codex
        # CARGO_TARGET_DIR is step-scoped on purpose: the runner context is
        # invalid in job-level env (workflow is rejected at dispatch), and a
        # job-wide target dir would also redirect the renderer build away from
        # rust/target/release/, which the installer resolves by fixed path.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          (
            while sleep 60; do
              echo "Cargo build heartbeat: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
              pgrep -fl 'cargo|rustc' | tail -20 || true
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          node scripts/install-patched-codex.js \
            --mode patched \
            --source-build \
            --version "$CODEX_VERSION" \
            --prefix "$RUNNER_TEMP/prefix" \
            --cache-dir "$RUNNER_TEMP/cache"

      - name: Upload Cargo timings
        if: always()
        # Pinned from refs/tags/v7.0.0 on 2026-08-06.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-${{ inputs.codex_version }}-${{ inputs.target }}-cargo-timings
          path: ${{ runner.temp }}/cargo-target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package runtime and licenses
        # Shared packager (also the maintainer's local-publish path): bundles
        # codex + LICENSE + NOTICE + codex-hud-runtime.json, ad-hoc codesigns,
        # health-checks --version, then writes the archive and its .sha256.
        run: |
          node scripts/package-patched-runtime.js \
            --payload "$RUNNER_TEMP/prefix/codex-hud-codex.d/$CODEX_VERSION/codex" \
            --version "$CODEX_VERSION" \
            --target "$CODEX_TARGET" \
            --source "$RUNNER_TEMP/cache/openai-codex-rust-v${CODEX_VERSION}" \
            --work "$RUNNER_TEMP" \
            --dist dist

      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="codex-runtime-v${CODEX_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Patched Codex runtime ${CODEX_VERSION}" \
              --notes "Checksummed codex-hud patched runtime for OpenAI Codex ${CODEX_VERSION}. The archive includes patch provenance plus the upstream Apache-2.0 LICENSE and NOTICE files."
          fi
          gh release upload "$tag" dist/* --clobber
