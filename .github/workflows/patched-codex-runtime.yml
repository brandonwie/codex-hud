name: Patched Codex Runtime

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: OpenAI Codex version to patch (without rust-v prefix)
        required: true
        type: string
      local_build_ok:
        description: >-
          Confirm a successful local source build of this exact version
          preceded this dispatch. Runner-minute guard: the job refuses to
          build without it.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: patched-codex-runtime-${{ inputs.codex_version }}-x86_64-apple-darwin
  cancel-in-progress: false

jobs:
  build-intel-macos:
    name: Build Intel macOS runtime
    runs-on: macos-15-intel
    # Hard cap. Cold-cache builds of the 126-crate Codex workspace have been
    # observed past 64 minutes; actions/cache only saves on success, so a cap
    # below the cold-build time can never bootstrap the cache. Tighten after
    # reading the cargo --timings artifact from a successful cached run.
    timeout-minutes: 90
    env:
      CODEX_VERSION: ${{ inputs.codex_version }}
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "none"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - name: Assert local build gate
        if: ${{ !inputs.local_build_ok }}
        run: |
          echo "::error::Refusing to build: local_build_ok is false. Run the local source build for this version first, then re-dispatch with local_build_ok=true."
          exit 1

      - name: Checkout
        # Pinned from refs/tags/v6 on 2026-06-11.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Pinned from refs/tags/v4 on 2026-06-11.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        # Pinned from refs/heads/stable on 2026-06-10.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Restore Cargo cache
        # Pinned from refs/tags/v5.0.4 on 2026-08-06.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/cargo-target
          key: patched-codex-${{ runner.os }}-${{ runner.arch }}-x86_64-apple-darwin-${{ hashFiles('scripts/install-patched-codex.js') }}-${{ inputs.codex_version }}
          restore-keys: |
            patched-codex-${{ runner.os }}-${{ runner.arch }}-x86_64-apple-darwin-${{ hashFiles('scripts/install-patched-codex.js') }}-
            patched-codex-${{ runner.os }}-${{ runner.arch }}-x86_64-apple-darwin-

      - name: Validate input
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.env.CODEX_VERSION)) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:rust

      - name: Build patched Codex
        # CARGO_TARGET_DIR is step-scoped on purpose: the runner context is
        # invalid in job-level env (workflow is rejected at dispatch), and a
        # job-wide target dir would also redirect the renderer build away from
        # rust/target/release/, which the installer resolves by fixed path.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          (
            while sleep 60; do
              echo "Cargo build heartbeat: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
              pgrep -fl 'cargo|rustc' | tail -20 || true
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          node scripts/install-patched-codex.js \
            --mode patched \
            --source-build \
            --version "$CODEX_VERSION" \
            --prefix "$RUNNER_TEMP/prefix" \
            --cache-dir "$RUNNER_TEMP/cache"

      - name: Upload Cargo timings
        if: always()
        # Pinned from refs/tags/v7.0.0 on 2026-08-06.
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-${{ inputs.codex_version }}-x86_64-apple-darwin-cargo-timings
          path: ${{ runner.temp }}/cargo-target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package runtime and licenses
        run: |
          target="x86_64-apple-darwin"
          base="codex-hud-codex-v${CODEX_VERSION}-${target}"
          bundle="$RUNNER_TEMP/$base"
          source="$RUNNER_TEMP/cache/openai-codex-rust-v${CODEX_VERSION}"
          mkdir -p "$bundle" dist
          cp "$RUNNER_TEMP/prefix/codex-hud-codex.d/$CODEX_VERSION/codex" "$bundle/codex"
          cp "$source/LICENSE" "$bundle/LICENSE"
          cp "$source/NOTICE" "$bundle/NOTICE"
          codesign --force --sign - "$bundle/codex"
          "$bundle/codex" --version
          export PATCH_SET_REVISION="$(node -p "require('./scripts/install-patched-codex').PATCH_SET_REVISION")"
          export SOURCE_COMMIT="$(git -C "$source" rev-parse HEAD)"
          export PAYLOAD_SHA256="$(shasum -a 256 "$bundle/codex" | awk '{print $1}')"
          node -e 'const fs = require("fs"); fs.writeFileSync(process.argv[1], `${JSON.stringify({ schemaVersion: 1, codexVersion: process.env.CODEX_VERSION, patchSetRevision: process.env.PATCH_SET_REVISION, sourceCommit: process.env.SOURCE_COMMIT, payloadSha256: process.env.PAYLOAD_SHA256 }, null, 2)}\n`)' "$bundle/codex-hud-runtime.json"
          tar -czf "dist/$base.tar.gz" -C "$RUNNER_TEMP" "$base"
          cd dist
          shasum -a 256 "$base.tar.gz" > "$base.tar.gz.sha256"

      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="codex-runtime-v${CODEX_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Patched Codex runtime ${CODEX_VERSION}" \
              --notes "Checksummed codex-hud patched runtime for OpenAI Codex ${CODEX_VERSION}. The archive includes patch provenance plus the upstream Apache-2.0 LICENSE and NOTICE files."
          fi
          gh release upload "$tag" dist/* --clobber
